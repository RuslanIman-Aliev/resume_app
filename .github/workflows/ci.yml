name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

# A second push to the same branch makes the run in flight pointless, and this
# workflow costs a build plus a browser suite every time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_app?schema=public
      NEXT_PUBLIC_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      # Signing key for the session cookie the e2e global setup mints. Without
      # it Better Auth falls back to a built-in default, which it refuses to do
      # outside development.
      BETTER_AUTH_SECRET: ci-test-secret-not-used-outside-ci
      # Required by `env.server` in a production build, which is what
      # `npm run build` is. CI never receives an Inngest request, so the value
      # only has to exist.
      INNGEST_SIGNING_KEY: signkey-prod-ci-not-used-outside-ci
      OPENAI_API_KEY: sk-test
      GITHUB_CLIENT_ID: test
      GITHUB_CLIENT_SECRET: test
      NEXT_PUBLIC_PUSHER_KEY: test
      NEXT_PUBLIC_PUSHER_CLUSTER: test
      PUSHER_APP_ID: test
      PUSHER_APP_KEY: test
      PUSHER_APP_SECRET: test
      PUSHER_APP_CLUSTER: test
      # Measured total is ~16.4MB, of which ~13MB is the Syncfusion document
      # editor emitted once per `next/dynamic` call site - the analyzer's
      # original-resume view and its improvements view each get their own copy.
      # Turbopack owns chunking in Next 16 and the webpack hook that could merge
      # them is not read, so the durable fix is one shared editor component
      # rather than a config flag. The budget is set just above today's total so
      # a new heavy dependency still trips it.
      BUNDLE_SIZE_LIMIT_BYTES: 17000000
      ROUTE_BUNDLE_SIZE_LIMIT_BYTES: 4500000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build production bundle
        run: npm run build
      - name: Check bundle size
        run: npm run check:bundle-size
      # Installed only once the cheap gates have passed: pulling a browser and
      # its system libraries costs about a minute, and a lint failure should not
      # have to pay it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke
      - name: E2E full tests (push)
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:full
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
