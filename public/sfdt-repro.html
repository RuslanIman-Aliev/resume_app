<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFDT Repro</title>
    <link
      rel="stylesheet"
      href="https://cdn.syncfusion.com/ej2/33.2.3/material.css"
    />
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        margin: 0;
        background: #f4f7fb;
      }
      .layout {
        display: grid;
        grid-template-rows: auto auto 1fr;
        height: 100vh;
      }
      .panel {
        padding: 12px;
        background: #ffffff;
        border-bottom: 1px solid #d7deea;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      input[type="text"] {
        flex: 1;
        min-width: 340px;
        padding: 8px;
        border: 1px solid #c6cfde;
        border-radius: 6px;
      }
      button {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #7f9dd6;
        background: #e8f0ff;
        cursor: pointer;
      }
      .status {
        font-size: 13px;
        color: #1f2a44;
        margin-top: 8px;
        white-space: pre-wrap;
      }
      #editorHost {
        min-height: 0;
      }
      #editorContainer {
        height: 100%;
      }
      #log {
        font-family: Consolas, monospace;
        font-size: 12px;
        max-height: 120px;
        overflow: auto;
        background: #0f1728;
        color: #d8e6ff;
        padding: 8px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="panel">
        <div class="row">
          <label for="resumeUrl">Resume URL:</label>
          <input id="resumeUrl" type="text" placeholder="https://...docx" />
          <button id="loadBtn">Load via /api/docx-to-sfdt</button>
        </div>
        <div class="status" id="status">Ready</div>
      </div>
      <div class="panel">
        <div id="log"></div>
      </div>
      <div id="editorHost">
        <div id="editorContainer"></div>
      </div>
    </div>

    <script src="https://cdn.syncfusion.com/ej2/33.2.3/dist/ej2.min.js"></script>
    <script>
      ej.base.registerLicense("Ngo9BigBOggjHTQxAR8/V1JHaF1cWmhIfEx1RHxQdld5ZFRHallYTnNWUj0eQnxTdENjXH1bcXBQTmFeUUxxWUleYA==");
      ej.documenteditor.DocumentEditorContainer.Inject(
        ej.documenteditor.Toolbar,
      );

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const urlInput = document.getElementById("resumeUrl");
      const loadBtn = document.getElementById("loadBtn");

      const params = new URLSearchParams(window.location.search);
      const prefilledUrl = params.get("url") || "";
      if (prefilledUrl) urlInput.value = prefilledUrl;

      function log(...args) {
        const line = args
          .map((a) => {
            if (typeof a === "string") return a;
            try {
              return JSON.stringify(a);
            } catch {
              return String(a);
            }
          })
          .join(" ");
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log("[sfdt-repro]", ...args);
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function normalizeSfdtValue(value) {
        if (Array.isArray(value)) {
          return value.map((v) => normalizeSfdtValue(v));
        }
        if (!value || typeof value !== "object") return value;
        const out = {};
        for (const [k, v] of Object.entries(value)) {
          const key = k === "tlp" ? "t" : k;
          out[key] = normalizeSfdtValue(v);
        }
        if (out.optimizeSfdt === true) {
          delete out.optimizeSfdt;
        }
        return out;
      }

      function normalizeSfdtText(text) {
        try {
          return JSON.stringify(normalizeSfdtValue(JSON.parse(text)));
        } catch {
          return text;
        }
      }

      const container = new ej.documenteditor.DocumentEditorContainer({
        height: "100%",
        enableToolbar: false,
        showPropertiesPane: false,
      });
      container.appendTo("#editorContainer");

      const editor = container.documentEditor;
      editor.serviceUrl = "";

      async function delay(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      async function ensureLoaded() {
        for (let i = 0; i < 10; i += 1) {
          const loaded = !!editor.isDocumentLoaded;
          const domPages = document.querySelectorAll(".e-de-page").length;
          if (loaded && domPages > 0) return true;
          await delay(250);
        }
        return !!editor.isDocumentLoaded;
      }

      async function tryOpenVariants(sfdtText) {
        let parsed = null;
        try {
          parsed = JSON.parse(sfdtText);
        } catch {
          parsed = null;
        }

        const variants = [];
        if (parsed) variants.push({ kind: "object", value: parsed });
        variants.push({
          kind: "normalizedString",
          value: normalizeSfdtText(sfdtText),
        });
        variants.push({ kind: "rawString", value: sfdtText });

        const optimizeOptions = [true, false];
        const methods = ["open", "openAsync"];

        for (const v of variants) {
          for (const optimize of optimizeOptions) {
            for (const method of methods) {
              try {
                if (editor.documentEditorSettings) {
                  editor.documentEditorSettings.optimizeSfdt = optimize;
                }
                log("trying", { method, input: v.kind, optimize });

                if (method === "open") {
                  editor.open(v.value);
                } else if (typeof editor.openAsync === "function") {
                  await editor.openAsync(v.value);
                }

                await delay(900);
                const loaded = await ensureLoaded();
                const domPages = document.querySelectorAll(".e-de-page").length;
                const pageCount = editor.pageCount || 0;
                log("result", { loaded, domPages, pageCount });

                if (domPages > 0 || pageCount > 0) {
                  return true;
                }

                try {
                  editor.openBlank();
                } catch {
                  // ignore
                }
                await delay(200);
              } catch (e) {
                log("variant error", String(e));
              }
            }
          }
        }

        return false;
      }

      async function loadFromApi() {
        const resumeUrl = urlInput.value.trim();
        if (!resumeUrl) {
          setStatus("Provide resume URL first");
          return;
        }
        console.log("loading resume from URL", resumeUrl);

        logEl.textContent = "";
        setStatus("Loading...");

        try {
          const res = await fetch("/api/docx-to-sfdt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: resumeUrl }),
          });

          const text = await res.text();
          log("api status", res.status, "len", text.length);

          if (!res.ok) {
            setStatus(`API error: ${res.status}`);
            log("api error body", text.slice(0, 1000));
            return;
          }

          let payload = text.trim();
          if (payload.startsWith('"') && payload.endsWith('"')) {
            try {
              payload = JSON.parse(payload);
            } catch {
              // ignore
            }
          }

          const ok = await tryOpenVariants(payload);
          const domPages = document.querySelectorAll(".e-de-page").length;
          const msg = `done, success=${ok}, pageCount=${editor.pageCount || 0}, domPages=${domPages}`;
          setStatus(msg);
          log(msg);
        } catch (e) {
          setStatus("Load failed");
          log("fatal error", String(e));
        }
      }

      loadBtn.addEventListener("click", loadFromApi);
      if (prefilledUrl) {
        loadFromApi();
      }
    </script>
  </body>
</html>
